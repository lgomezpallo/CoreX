name: Deploy Router Provider Accounts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-router-provider-accounts.yml'

permissions:
  contents: read

jobs:
  deploy-and-migrate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_CLERK_PROXY_URL: ${{ secrets.VITE_CLERK_PROXY_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NODE_ENV: production
      PORT: '8080'
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_DATABASE_URL SESSION_SECRET CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY VITE_CLERK_PUBLISHABLE_KEY GROQ_API_KEY; do
            test -n "${!name:-}" || { echo "Missing secret: $name"; exit 1; }
          done

      - name: Extract and patch Router
        run: |
          set -euo pipefail
          rm -rf /tmp/router-export
          mkdir -p /tmp/router-export
          unzip -q 'router-ia-export 20260927.zip' -d /tmp/router-export
          python3 scripts/patch-router-cloudflare-account.py
          python3 scripts/patch-router-provider-accounts.py
          python3 scripts/fix-provider-account-ui.py
          python3 scripts/patch-router-cloudflare-runtime.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: /tmp/router-export
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        working-directory: /tmp/router-export
        run: |
          set -euo pipefail
          pnpm run typecheck
          pnpm run build
          pnpm run build:cloudflare

      - name: Upload runtime secrets
        working-directory: /tmp/router-export
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SUPABASE_DATABASE_URL" | pnpm exec wrangler secret put SUPABASE_DATABASE_URL --config wrangler.jsonc
          printf '%s' "$SESSION_SECRET" | pnpm exec wrangler secret put SESSION_SECRET --config wrangler.jsonc
          printf '%s' "$CLERK_PUBLISHABLE_KEY" | pnpm exec wrangler secret put CLERK_PUBLISHABLE_KEY --config wrangler.jsonc
          printf '%s' "$CLERK_SECRET_KEY" | pnpm exec wrangler secret put CLERK_SECRET_KEY --config wrangler.jsonc
          printf '%s' "$VITE_CLERK_PUBLISHABLE_KEY" | pnpm exec wrangler secret put VITE_CLERK_PUBLISHABLE_KEY --config wrangler.jsonc
          printf '%s' "$GROQ_API_KEY" | pnpm exec wrangler secret put GROQ_API_KEY --config wrangler.jsonc
          if [ -n "${VITE_CLERK_PROXY_URL:-}" ]; then
            printf '%s' "$VITE_CLERK_PROXY_URL" | pnpm exec wrangler secret put VITE_CLERK_PROXY_URL --config wrangler.jsonc
          fi

      - name: Deploy Router IA
        working-directory: /tmp/router-export
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --config wrangler.jsonc 2>&1 | tee /tmp/router-provider-accounts-deploy.log

      - name: Verify public health
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/router-health -w '%{http_code}' --max-time 30 https://router-ia.luisgomezpallo.workers.dev/health)
          echo "Public health HTTP $code"
          cat /tmp/router-health
          echo
          test "$code" = '200'

      - name: Verify catalogs and migrate existing providers to account mode
        working-directory: /tmp/router-export/artifacts/api-server
        shell: bash
        run: |
          set -euo pipefail
          cat > src/migrate-provider-accounts.ts <<'TS'
          import { eq } from "drizzle-orm";
          import { db, aiProvidersTable } from "@workspace/db";
          import { decryptApiKey, listProviderAccountModels, type ProviderConfig } from "./lib/ai-router";

          async function main() {
            const rows = await db.select().from(aiProvidersTable);
            const groq = rows.find((p) => p.kind === "groq");
            const nvidia = rows.find((p) => p.kind === "nvidia" || (p.kind === "openai-compatible" && ((p.baseUrl ?? "").includes("integrate.api.nvidia.com") || p.name.toLowerCase().includes("nvidia"))));
            if (!groq) throw new Error("Groq provider row not found.");
            if (!nvidia) throw new Error("NVIDIA provider row not found.");

            const groqKey = process.env.GROQ_API_KEY?.trim() || decryptApiKey(groq);
            const groqConfig: ProviderConfig = { kind: "groq", model: "__auto__", baseUrl: null, apiKey: groqKey };
            const nvidiaConfig: ProviderConfig = { kind: "nvidia", model: "__auto__", baseUrl: null, apiKey: decryptApiKey(nvidia) };

            const [groqModels, nvidiaModels] = await Promise.all([
              listProviderAccountModels(groqConfig, true),
              listProviderAccountModels(nvidiaConfig, true),
            ]);
            if (!groqModels.length) throw new Error("Groq catalog returned no usable models.");
            if (!nvidiaModels.length) throw new Error("NVIDIA catalog returned no usable models.");

            await db.update(aiProvidersTable).set({
              model: "__auto__",
              status: "connected",
              healthStatus: "available",
              isActive: true,
              updatedAt: new Date(),
            }).where(eq(aiProvidersTable.id, groq.id));

            await db.update(aiProvidersTable).set({
              kind: "nvidia",
              model: "__auto__",
              baseUrl: null,
              status: "connected",
              healthStatus: "available",
              isActive: true,
              updatedAt: new Date(),
            }).where(eq(aiProvidersTable.id, nvidia.id));

            console.log(`Groq account catalog: ${groqModels.length} usable models`);
            console.log(`NVIDIA account catalog: ${nvidiaModels.length} usable models`);
            console.log('Groq and NVIDIA migrated to provider-account mode (__auto__).');
          }

          main().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          TS
          pnpm dlx tsx src/migrate-provider-accounts.ts
          rm -f src/migrate-provider-accounts.ts

      - name: Final public health
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/router-final-health -w '%{http_code}' --max-time 30 https://router-ia.luisgomezpallo.workers.dev/health)
          echo "Final public health HTTP $code"
          test "$code" = '200'
