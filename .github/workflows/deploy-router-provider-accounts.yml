name: Deploy Router Provider Accounts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-router-provider-accounts.yml'
      - 'scripts/fix-provider-account-ui.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_CLERK_PROXY_URL: ${{ secrets.VITE_CLERK_PROXY_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NODE_ENV: production
      PORT: '8080'
      BASE_PATH: /

    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_DATABASE_URL SESSION_SECRET CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY VITE_CLERK_PUBLISHABLE_KEY GROQ_API_KEY; do
            test -n "${!name:-}" || { echo "Missing secret: $name"; exit 1; }
          done

      - name: Extract and patch Router
        run: |
          set -euo pipefail
          rm -rf /tmp/router-export
          mkdir -p /tmp/router-export
          unzip -q 'router-ia-export 20260927.zip' -d /tmp/router-export
          python3 scripts/patch-router-cloudflare-account.py
          python3 scripts/patch-router-provider-accounts.py
          python3 scripts/fix-provider-account-ui.py
          python3 scripts/patch-router-cloudflare-runtime.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: /tmp/router-export
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        working-directory: /tmp/router-export
        run: |
          set -euo pipefail
          pnpm run typecheck
          pnpm run build
          pnpm run build:cloudflare

      - name: Upload runtime secrets
        working-directory: /tmp/router-export
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SUPABASE_DATABASE_URL" | pnpm exec wrangler secret put SUPABASE_DATABASE_URL --config wrangler.jsonc
          printf '%s' "$SESSION_SECRET" | pnpm exec wrangler secret put SESSION_SECRET --config wrangler.jsonc
          printf '%s' "$CLERK_PUBLISHABLE_KEY" | pnpm exec wrangler secret put CLERK_PUBLISHABLE_KEY --config wrangler.jsonc
          printf '%s' "$CLERK_SECRET_KEY" | pnpm exec wrangler secret put CLERK_SECRET_KEY --config wrangler.jsonc
          printf '%s' "$VITE_CLERK_PUBLISHABLE_KEY" | pnpm exec wrangler secret put VITE_CLERK_PUBLISHABLE_KEY --config wrangler.jsonc
          printf '%s' "$GROQ_API_KEY" | pnpm exec wrangler secret put GROQ_API_KEY --config wrangler.jsonc
          if [ -n "${VITE_CLERK_PROXY_URL:-}" ]; then
            printf '%s' "$VITE_CLERK_PROXY_URL" | pnpm exec wrangler secret put VITE_CLERK_PROXY_URL --config wrangler.jsonc
          fi

      - name: Deploy Router IA
        working-directory: /tmp/router-export
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --config wrangler.jsonc 2>&1 | tee /tmp/router-deploy.log

      - name: Verify public Router
        shell: bash
        run: |
          set -euo pipefail
          root_code=$(curl -sS -o /tmp/router-root -w '%{http_code}' --max-time 30 https://router-ia.luisgomezpallo.workers.dev/)
          health_code=$(curl -sS -o /tmp/router-health -w '%{http_code}' --max-time 30 https://router-ia.luisgomezpallo.workers.dev/health)
          echo "Root HTTP $root_code"
          echo "Health HTTP $health_code"
          cat /tmp/router-health
          echo
          test "$root_code" = '200'
          test "$health_code" = '200'
