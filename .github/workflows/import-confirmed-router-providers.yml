name: Import Confirmed Router Providers

on:
  push:
    paths:
      - '.github/workflows/import-confirmed-router-providers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_DATABASE_URL SESSION_SECRET GROQ_API_KEY NVIDIA_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!name:-}" || { echo "Missing secret: $name"; exit 1; }
          done
          echo 'Required secrets are present.'

      - name: Put Groq secret in Router Worker runtime
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GROQ_API_KEY" | npx --yes wrangler@4 secret put GROQ_API_KEY --name router-ia
          echo 'GROQ_API_KEY installed in Router Worker runtime.'

      - name: Extract Router export
        run: |
          set -euo pipefail
          rm -rf /tmp/router-export
          mkdir -p /tmp/router-export
          unzip -q 'router-ia-export 20260927.zip' -d /tmp/router-export

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Router dependencies
        working-directory: /tmp/router-export
        run: pnpm install --frozen-lockfile

      - name: Verify, import and activate Groq plus NVIDIA
        working-directory: /tmp/router-export
        shell: bash
        run: |
          set -euo pipefail
          cat > ./import-confirmed-providers.ts <<'TS'
          import { and, eq } from "drizzle-orm";
          import { db, aiProvidersTable, routerOwnerTable } from "@workspace/db";
          import { encryptApiKey, runProviderChat } from "./artifacts/api-server/src/lib/ai-router";

          const groqKey = process.env.GROQ_API_KEY?.trim();
          const nvidiaKey = process.env.NVIDIA_API_KEY?.trim();
          if (!groqKey || !nvidiaKey) throw new Error("Provider secrets are unavailable.");

          const [owner] = await db.select().from(routerOwnerTable).limit(1);
          if (!owner?.userId) {
            throw new Error("Router owner is not initialized. Sign in to Router IA once before importing providers.");
          }
          const userId = owner.userId;

          async function groqCatalog(): Promise<string[]> {
            const response = await fetch("https://api.groq.com/openai/v1/models", {
              headers: { authorization: `Bearer ${groqKey}`, accept: "application/json" },
            });
            if (!response.ok) throw new Error(`Groq catalog HTTP ${response.status}`);
            const payload: any = await response.json();
            return Array.isArray(payload?.data)
              ? payload.data.map((m: any) => String(m?.id ?? "")).filter(Boolean)
              : [];
          }

          async function chooseWorkingGroqModel(): Promise<string> {
            const ids = await groqCatalog();
            if (!ids.length) throw new Error("Groq returned no models.");
            const preferred = [
              "llama-3.3-70b-versatile",
              "llama-3.1-8b-instant",
              "qwen/qwen3-32b",
            ];
            const candidates = [
              ...preferred.filter((id) => ids.includes(id)),
              ...ids.filter((id) => !preferred.includes(id) && !/whisper|tts|guard|audio|orpheus/i.test(id)),
            ];
            let lastError = "none";
            for (const model of candidates.slice(0, 8)) {
              try {
                const result = await runProviderChat(
                  { kind: "groq", baseUrl: null, model, apiKey: groqKey },
                  [{ role: "user", content: "Reply only with OK" }],
                  { temperature: 0, maxTokens: 8 },
                );
                if (result.content.trim()) {
                  console.log(`Groq probe: OK (${model})`);
                  return model;
                }
              } catch (error) {
                lastError = error instanceof Error ? error.message : String(error);
                console.log(`Groq probe skipped model ${model}: ${lastError.slice(0, 120)}`);
              }
            }
            throw new Error(`No working Groq chat model found. Last error: ${lastError}`);
          }

          const groqModel = await chooseWorkingGroqModel();
          const nvidiaModel = "openai/gpt-oss-20b";
          const nvidiaBaseUrl = "https://integrate.api.nvidia.com/v1";

          const nvidiaProbe = await runProviderChat(
            { kind: "openai-compatible", baseUrl: nvidiaBaseUrl, model: nvidiaModel, apiKey: nvidiaKey },
            [{ role: "user", content: "Reply only with OK" }],
            { temperature: 0, maxTokens: 8 },
          );
          if (!nvidiaProbe.content.trim()) throw new Error("NVIDIA returned an empty chat response.");
          console.log(`NVIDIA probe: OK (${nvidiaModel})`);

          let existing = await db
            .select()
            .from(aiProvidersTable)
            .where(eq(aiProvidersTable.userId, userId));

          // Cloudflare stays stored if it exists, but is removed from the active routing pool for now.
          for (const provider of existing.filter((p) => p.kind === "cloudflare")) {
            await db.update(aiProvidersTable)
              .set({ isActive: false, isDefault: false, updatedAt: new Date() })
              .where(and(eq(aiProvidersTable.userId, userId), eq(aiProvidersTable.id, provider.id)));
            console.log(`Cloudflare disabled from routing pool: ${provider.name}`);
          }

          existing = await db
            .select()
            .from(aiProvidersTable)
            .where(eq(aiProvidersTable.userId, userId));

          const existingGroq = existing.find((p) => p.kind === "groq");
          const existingNvidia = existing.find(
            (p) => p.kind === "openai-compatible" && p.baseUrl === nvidiaBaseUrl,
          );
          const otherActiveDefault = existing.some(
            (p) => p.isDefault && p.isActive && p.id !== existingGroq?.id && p.id !== existingNvidia?.id,
          );
          const makeGroqDefault = !otherActiveDefault;

          if (makeGroqDefault) {
            await db.update(aiProvidersTable)
              .set({ isDefault: false, updatedAt: new Date() })
              .where(eq(aiProvidersTable.userId, userId));
          }

          const groqValues = {
            name: "Groq",
            kind: "groq",
            baseUrl: null,
            model: groqModel,
            ...encryptApiKey(groqKey),
            capabilities: ["chat"] as any,
            priority: 70,
            isActive: true,
            isDefault: makeGroqDefault,
            healthStatus: "available",
            consecutiveFailures: 0,
            cooldownUntil: null,
            status: "connected",
            lastTestAt: new Date(),
            updatedAt: new Date(),
          };

          if (existingGroq) {
            await db.update(aiProvidersTable).set(groqValues).where(
              and(eq(aiProvidersTable.userId, userId), eq(aiProvidersTable.id, existingGroq.id)),
            );
            console.log(`Groq: UPDATED (${groqModel})`);
          } else {
            await db.insert(aiProvidersTable).values({ userId, ...groqValues });
            console.log(`Groq: CREATED (${groqModel})`);
          }

          const nvidiaValues = {
            name: "NVIDIA",
            kind: "openai-compatible",
            baseUrl: nvidiaBaseUrl,
            model: nvidiaModel,
            ...encryptApiKey(nvidiaKey),
            capabilities: ["chat"] as any,
            priority: 60,
            isActive: true,
            isDefault: false,
            healthStatus: "available",
            consecutiveFailures: 0,
            cooldownUntil: null,
            status: "connected",
            lastTestAt: new Date(),
            updatedAt: new Date(),
          };

          if (existingNvidia) {
            await db.update(aiProvidersTable).set(nvidiaValues).where(
              and(eq(aiProvidersTable.userId, userId), eq(aiProvidersTable.id, existingNvidia.id)),
            );
            console.log(`NVIDIA: UPDATED (${nvidiaModel})`);
          } else {
            await db.insert(aiProvidersTable).values({ userId, ...nvidiaValues });
            console.log(`NVIDIA: CREATED (${nvidiaModel})`);
          }

          const finalRows = await db
            .select({
              name: aiProvidersTable.name,
              kind: aiProvidersTable.kind,
              model: aiProvidersTable.model,
              isDefault: aiProvidersTable.isDefault,
              isActive: aiProvidersTable.isActive,
              status: aiProvidersTable.status,
              healthStatus: aiProvidersTable.healthStatus,
            })
            .from(aiProvidersTable)
            .where(eq(aiProvidersTable.userId, userId));

          const groqFinal = finalRows.find((p) => p.kind === "groq");
          const nvidiaFinal = finalRows.find((p) => p.kind === "openai-compatible" && p.name === "NVIDIA");
          if (!groqFinal?.isActive || groqFinal.status !== "connected") throw new Error("Groq was not activated correctly.");
          if (!nvidiaFinal?.isActive || nvidiaFinal.status !== "connected") throw new Error("NVIDIA was not activated correctly.");

          console.log("=== Router provider state ===");
          for (const p of finalRows) {
            console.log(`${p.name}: kind=${p.kind} model=${p.model} active=${p.isActive} default=${p.isDefault} status=${p.status} health=${p.healthStatus}`);
          }
          TS

          pnpm exec tsx ./import-confirmed-providers.ts
          rm -f ./import-confirmed-providers.ts
          echo 'Confirmed providers imported without printing secret values.'
