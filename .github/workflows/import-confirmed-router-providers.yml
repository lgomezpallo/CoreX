name: Import Confirmed Router Providers

on:
  push:
    paths:
      - '.github/workflows/import-confirmed-router-providers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_DATABASE_URL SESSION_SECRET GROQ_API_KEY NVIDIA_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!name:-}" || { echo "Missing secret: $name"; exit 1; }
          done
          echo 'Required secrets are present.'

      - name: Put Groq secret in Router Worker runtime
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GROQ_API_KEY" | npx --yes wrangler@4 secret put GROQ_API_KEY --name router-ia
          echo 'GROQ_API_KEY installed in Router Worker runtime.'

      - name: Extract Router export
        run: |
          set -euo pipefail
          rm -rf /tmp/router-export
          mkdir -p /tmp/router-export
          unzip -q 'router-ia-export 20260927.zip' -d /tmp/router-export

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Router dependencies
        working-directory: /tmp/router-export
        run: pnpm install --frozen-lockfile

      - name: Verify, import and activate Groq plus NVIDIA
        working-directory: /tmp/router-export/artifacts/api-server
        shell: bash
        run: |
          set -euo pipefail
          cat > ./src/import-confirmed-providers.ts <<'TS'
          import { and, eq } from "drizzle-orm";
          import { db, aiProvidersTable, routerOwnerTable } from "@workspace/db";
          import { encryptApiKey, runProviderChat } from "./lib/ai-router";

          async function chooseWorkingModel(
            kind: "groq" | "openai-compatible",
            baseUrl: string | null,
            apiKey: string,
            candidates: string[],
            label: string,
          ): Promise<string> {
            let lastError = "none";
            for (const model of candidates.slice(0, 12)) {
              try {
                const result = await runProviderChat(
                  { kind, baseUrl, model, apiKey },
                  [{ role: "user", content: "Reply only with OK" }],
                  { temperature: 0, maxTokens: 96 },
                );
                if (result.content.trim()) {
                  console.log(`${label} probe: OK (${model})`);
                  return model;
                }
              } catch (error) {
                lastError = error instanceof Error ? error.message : String(error);
                console.log(`${label} candidate skipped: ${model} (${lastError.slice(0, 100)})`);
              }
            }
            throw new Error(`No working ${label} chat model. Last error: ${lastError}`);
          }

          async function modelIds(url: string, apiKey: string): Promise<string[]> {
            const response = await fetch(url, {
              headers: { authorization: `Bearer ${apiKey}`, accept: "application/json" },
            });
            if (!response.ok) throw new Error(`Model catalog HTTP ${response.status} for ${url}`);
            const payload: any = await response.json();
            const rows = Array.isArray(payload?.data) ? payload.data : Array.isArray(payload?.models) ? payload.models : [];
            return rows.map((m: any) => String(m?.id ?? m?.name ?? "")).filter(Boolean);
          }

          async function main() {
            const groqKey = process.env.GROQ_API_KEY?.trim();
            const nvidiaKey = process.env.NVIDIA_API_KEY?.trim();
            if (!groqKey || !nvidiaKey) throw new Error("Provider secrets are unavailable.");

            const [owner] = await db.select().from(routerOwnerTable).limit(1);
            if (!owner?.userId) throw new Error("Router owner is not initialized. Sign in to Router IA once first.");
            const userId = owner.userId;

            const groqIds = await modelIds("https://api.groq.com/openai/v1/models", groqKey);
            const groqPreferred = ["llama-3.3-70b-versatile", "llama-3.1-8b-instant", "qwen/qwen3.8-27b", "qwen/qwen3-32b"];
            const groqCandidates = [
              ...groqPreferred.filter((id) => groqIds.includes(id)),
              ...groqIds.filter((id) => !groqPreferred.includes(id) && !/whisper|tts|guard|audio|orpheus/i.test(id)),
            ];
            const groqModel = await chooseWorkingModel("groq", null, groqKey, groqCandidates, "Groq");

            const nvidiaBaseUrl = "https://integrate.api.nvidia.com/v1";
            const nvidiaIds = await modelIds(`${nvidiaBaseUrl}/models`, nvidiaKey);
            const nvidiaPreferred = [
              "meta/llama-3.1-8b-instruct",
              "meta/llama-3.3-70b-instruct",
              "meta/llama-3.1-70b-instruct",
              "qwen/qwen3-32b",
              "mistralai/mistral-small-24b-instruct-2501",
              "openai/gpt-oss-20b",
            ];
            const nvidiaUsable = nvidiaIds.filter((id) =>
              !/embed|rerank|guard|vision|vl|audio|whisper|tts|reward|classifier/i.test(id),
            );
            const nvidiaCandidates = [
              ...nvidiaPreferred.filter((id) => nvidiaIds.includes(id)),
              ...nvidiaUsable.filter((id) => !nvidiaPreferred.includes(id) && /instruct|chat|llama|qwen|mistral/i.test(id)),
            ];
            if (!nvidiaCandidates.length) throw new Error("NVIDIA returned no chat-like models.");
            const nvidiaModel = await chooseWorkingModel(
              "openai-compatible", nvidiaBaseUrl, nvidiaKey, nvidiaCandidates, "NVIDIA",
            );

            let existing = await db.select().from(aiProvidersTable).where(eq(aiProvidersTable.userId, userId));

            for (const provider of existing.filter((p) => p.kind === "cloudflare")) {
              await db.update(aiProvidersTable)
                .set({ isActive: false, isDefault: false, updatedAt: new Date() })
                .where(and(eq(aiProvidersTable.userId, userId), eq(aiProvidersTable.id, provider.id)));
              console.log(`Cloudflare disabled from routing pool: ${provider.name}`);
            }

            existing = await db.select().from(aiProvidersTable).where(eq(aiProvidersTable.userId, userId));
            const oldGroq = existing.find((p) => p.kind === "groq");
            const oldNvidia = existing.find((p) => p.kind === "openai-compatible" && p.baseUrl === nvidiaBaseUrl);
            const otherDefault = existing.some(
              (p) => p.isDefault && p.isActive && p.id !== oldGroq?.id && p.id !== oldNvidia?.id,
            );
            const groqDefault = !otherDefault;

            if (groqDefault) {
              await db.update(aiProvidersTable).set({ isDefault: false, updatedAt: new Date() })
                .where(eq(aiProvidersTable.userId, userId));
            }

            const groqValues = {
              name: "Groq", kind: "groq", baseUrl: null, model: groqModel,
              ...encryptApiKey(groqKey), capabilities: ["chat"] as any, priority: 70,
              isActive: true, isDefault: groqDefault, healthStatus: "available",
              consecutiveFailures: 0, cooldownUntil: null, status: "connected",
              lastTestAt: new Date(), updatedAt: new Date(),
            };
            if (oldGroq) {
              await db.update(aiProvidersTable).set(groqValues).where(
                and(eq(aiProvidersTable.userId, userId), eq(aiProvidersTable.id, oldGroq.id)),
              );
              console.log(`Groq: UPDATED (${groqModel})`);
            } else {
              await db.insert(aiProvidersTable).values({ userId, ...groqValues });
              console.log(`Groq: CREATED (${groqModel})`);
            }

            const nvidiaValues = {
              name: "NVIDIA", kind: "openai-compatible", baseUrl: nvidiaBaseUrl, model: nvidiaModel,
              ...encryptApiKey(nvidiaKey), capabilities: ["chat"] as any, priority: 60,
              isActive: true, isDefault: false, healthStatus: "available",
              consecutiveFailures: 0, cooldownUntil: null, status: "connected",
              lastTestAt: new Date(), updatedAt: new Date(),
            };
            if (oldNvidia) {
              await db.update(aiProvidersTable).set(nvidiaValues).where(
                and(eq(aiProvidersTable.userId, userId), eq(aiProvidersTable.id, oldNvidia.id)),
              );
              console.log(`NVIDIA: UPDATED (${nvidiaModel})`);
            } else {
              await db.insert(aiProvidersTable).values({ userId, ...nvidiaValues });
              console.log(`NVIDIA: CREATED (${nvidiaModel})`);
            }

            const finalRows = await db.select({
              name: aiProvidersTable.name, kind: aiProvidersTable.kind, model: aiProvidersTable.model,
              isDefault: aiProvidersTable.isDefault, isActive: aiProvidersTable.isActive,
              status: aiProvidersTable.status, healthStatus: aiProvidersTable.healthStatus,
            }).from(aiProvidersTable).where(eq(aiProvidersTable.userId, userId));

            const gf = finalRows.find((p) => p.kind === "groq");
            const nf = finalRows.find((p) => p.kind === "openai-compatible" && p.name === "NVIDIA");
            if (!gf?.isActive || gf.status !== "connected") throw new Error("Groq was not activated correctly.");
            if (!nf?.isActive || nf.status !== "connected") throw new Error("NVIDIA was not activated correctly.");

            console.log("=== Router provider state ===");
            for (const p of finalRows) {
              console.log(`${p.name}: kind=${p.kind} model=${p.model} active=${p.isActive} default=${p.isDefault} status=${p.status} health=${p.healthStatus}`);
            }
          }

          main().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          TS

          pnpm dlx tsx ./src/import-confirmed-providers.ts
          rm -f ./src/import-confirmed-providers.ts
          echo 'Confirmed providers imported without printing secret values.'
