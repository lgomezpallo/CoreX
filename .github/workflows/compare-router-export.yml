name: Compare Router export

on:
  workflow_dispatch:
  push:
    paths:
      - 'router-ia-export 20260927.zip'
      - '.github/workflows/compare-router-export.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare new export with current Router
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/router-new
          mkdir -p /tmp/router-new
          unzip -q 'router-ia-export 20260927.zip' -d /tmp/router-new

          echo '=== NEW EXPORT TOP LEVEL ==='
          find /tmp/router-new -maxdepth 2 -mindepth 1 -printf '%P\n' | sort | head -200

          new_root='/tmp/router-new'
          if [ "$(find /tmp/router-new -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1 ] && [ "$(find /tmp/router-new -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 0 ]; then
            new_root="$(find /tmp/router-new -mindepth 1 -maxdepth 1 -type d | head -1)"
          fi

          current='projects/router-ia/Router-IA-Privado'
          echo
          echo "NEW_ROOT=$new_root"
          echo "CURRENT=$current"

          echo
          echo '=== FILE COUNTS ==='
          echo "new=$(find "$new_root" -type f | wc -l)"
          echo "current=$(find "$current" -type f | wc -l)"

          echo
          echo '=== ONLY IN NEW ==='
          diff -qr \
            --exclude='.git' --exclude='node_modules' --exclude='dist' --exclude='.cache' \
            "$current" "$new_root" 2>/dev/null | sed -n 's#^Only in /tmp/router-new[^:]*: #NEW: #p' | head -200 || true

          echo
          echo '=== ONLY IN CURRENT ==='
          diff -qr \
            --exclude='.git' --exclude='node_modules' --exclude='dist' --exclude='.cache' \
            "$current" "$new_root" 2>/dev/null | sed -n "s#^Only in $current[^:]*: #CURRENT: #p" | head -200 || true

          echo
          echo '=== DIFFERING FILES ==='
          diff -qr \
            --exclude='.git' --exclude='node_modules' --exclude='dist' --exclude='.cache' \
            "$current" "$new_root" 2>/dev/null | grep '^Files ' | head -300 || true

          echo
          echo '=== KEY FILES IN NEW ==='
          find "$new_root" -type f \( -name 'package.json' -o -name 'wrangler.jsonc' -o -name 'wrangler.toml' -o -name 'Dockerfile' -o -name '.env.example' -o -name 'README.md' \) -print | sort
