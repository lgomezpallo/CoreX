name: Trigger Router Deploy After Fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-router-cloudflare-account.py'
      - '.github/workflows/trigger-router-deploy-on-fix.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Router Cloudflare deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-router-cloudflare.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'Router deploy dispatched.'
