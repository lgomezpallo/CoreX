name: Inspect Provider Account Catalog Architecture

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-provider-account-catalog.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Router export
        run: |
          set -euo pipefail
          rm -rf /tmp/router-export
          mkdir -p /tmp/router-export
          unzip -q 'router-ia-export 20260927.zip' -d /tmp/router-export
      - name: Inspect provider, model and radar architecture
        working-directory: /tmp/router-export
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [
            Path('lib/db/src/schema'),
            Path('lib/db/src'),
            Path('artifacts/api-server/src/lib/ai-router.ts'),
            Path('artifacts/api-server/src/lib/model-radar.ts'),
            Path('artifacts/api-server/src/routes/ai-router.ts'),
            Path('artifacts/api-server/src/routes'),
            Path('artifacts/router-ia/src/pages/radar.tsx'),
            Path('artifacts/router-ia/src/App.tsx'),
          ]
          pat = re.compile(r'aiProviders|provider|model|radar|capabilit|catalog|route|priority|health|metric|openrouter|groq', re.I)
          printed = 0
          seen = set()
          for t in targets:
            files = [t] if t.is_file() else list(t.rglob('*.ts')) + list(t.rglob('*.tsx')) if t.exists() else []
            for p in files:
              if p in seen: continue
              seen.add(p)
              lines = p.read_text(errors='replace').splitlines()
              hits = [i for i,l in enumerate(lines) if pat.search(l)]
              if not hits: continue
              print(f'\n===== {p} =====')
              shown=set()
              for i in hits:
                for j in range(max(0,i-4), min(len(lines), i+7)):
                  if j in shown: continue
                  shown.add(j)
                  print(f'{j+1:04d}: {lines[j]}')
                  printed += 1
                  if printed >= 1800:
                    print('\n=== TRUNCATED ===')
                    raise SystemExit(0)
          PY
