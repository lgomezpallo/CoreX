name: Inspect Router API Client

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-router-api-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Router
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/router-export
          mkdir -p /tmp/router-export
          unzip -q 'router-ia-export 20260927.zip' -d /tmp/router-export
          python3 scripts/patch-router-cloudflare-account.py
          python3 scripts/patch-router-provider-accounts.py
          python3 scripts/fix-provider-account-ui.py
          python3 scripts/fix-radar-provider-discovery-types.py
          python3 scripts/expand-radar-free-providers.py
          python3 scripts/patch-router-cloudflare-runtime.py
          python3 scripts/patch-router-mobile-home.py
          python3 scripts/patch-openrouter-radar.py
      - name: Inspect generated client
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/router-export
          echo '=== API CLIENT DIRS ==='
          find "$ROOT" -maxdepth 4 -type d | grep -Ei 'api-client|client-react|generated' | head -80 || true
          echo '=== useCreateProvider ==='
          grep -Rni -C 35 'useCreateProvider' "$ROOT" --exclude-dir=node_modules | head -420 || true
          echo '=== createProvider ==='
          grep -Rni -C 30 'createProvider' "$ROOT" --exclude-dir=node_modules | head -420 || true
          echo '=== providers URLs ==='
          grep -Rni -C 12 'router/providers\|/providers' "$ROOT" --exclude-dir=node_modules --include='*.ts' --include='*.tsx' | head -500 || true
