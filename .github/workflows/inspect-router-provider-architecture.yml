name: Inspect Router Provider Architecture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Router export
        run: |
          set -euo pipefail
          rm -rf /tmp/router-export
          mkdir -p /tmp/router-export
          unzip -q 'router-ia-export 20260927.zip' -d /tmp/router-export

      - name: Show provider architecture
        working-directory: /tmp/router-export
        shell: bash
        run: |
          set -euo pipefail
          echo '===== DB SCHEMA ====='
          sed -n '1,260p' lib/db/src/schema/ai-router.ts || true

          echo
          echo '===== API CONTRACT FILES ====='
          grep -RnlE 'CreateProviderBody|UpdateProviderBody|ListProvidersResponse|ProviderInput|ProviderKind' lib artifacts 2>/dev/null | head -40
          for f in $(grep -RnlE 'CreateProviderBody|UpdateProviderBody|ListProvidersResponse' lib/api-zod lib/api-spec 2>/dev/null | head -8); do
            echo
            echo "--- $f ---"
            sed -n '1,320p' "$f"
          done

          echo
          echo '===== BACKEND PROVIDER ROUTES ====='
          sed -n '1,560p' artifacts/api-server/src/routes/ai-router.ts

          echo
          echo '===== AI ROUTER LIB ====='
          sed -n '1,560p' artifacts/api-server/src/lib/ai-router.ts

          echo
          echo '===== APP PROVIDER UI ====='
          sed -n '320,620p' artifacts/router-ia/src/App.tsx

          echo
          echo '===== ROUTE MOUNTING ====='
          sed -n '1,260p' artifacts/api-server/src/app.ts
          sed -n '1,220p' artifacts/api-server/src/routes/index.ts

          echo
          echo '===== MIGRATIONS ====='
          find lib/db/migrations -maxdepth 2 -type f -print | sort

          echo
          echo '===== CLOUDFLARE REFERENCES ====='
          grep -RniE 'cloudflare|workers ai|account[_ -]?id|api.cloudflare.com' artifacts lib 2>/dev/null | head -220 || true
