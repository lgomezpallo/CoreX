name: Inspect Router App Tokens

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-router-app-tokens.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect app token id schema
        run: |
          set -euo pipefail
          rm -rf /tmp/router-export
          mkdir -p /tmp/router-export
          unzip -q 'router-ia-export 20260927.zip' -d /tmp/router-export
          cd /tmp/router-export
          sed -n '496,512p' lib/api-zod/src/generated/api.ts
