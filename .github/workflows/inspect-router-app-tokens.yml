name: Inspect Router App Tokens

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-router-app-tokens.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect app token table and references
        run: |
          set -euo pipefail
          rm -rf /tmp/router-export
          mkdir -p /tmp/router-export
          unzip -q 'router-ia-export 20260927.zip' -d /tmp/router-export
          cd /tmp/router-export
          echo '=== ALL APP TOKEN REFERENCES ==='
          grep -RniE 'routerAppTokensTable|router_app_tokens|routerAppToken' . --exclude='*.map' --exclude-dir=node_modules | head -400 || true
          echo
          echo '=== SCHEMA AROUND TABLE ==='
          for f in $(grep -Rl 'routerAppTokensTable\|router_app_tokens' lib artifacts --exclude='*.map' 2>/dev/null); do echo "--- $f"; grep -n -B12 -A35 'routerAppTokensTable\|router_app_tokens' "$f" | head -180; done
