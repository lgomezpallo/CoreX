name: Inspect Router App Tokens

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-router-app-tokens.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect token routes and client
        run: |
          set -euo pipefail
          rm -rf /tmp/router-export
          mkdir -p /tmp/router-export
          unzip -q 'router-ia-export 20260927.zip' -d /tmp/router-export
          cd /tmp/router-export
          echo '=== BACKEND REVOKE ROUTE ==='
          sed -n '1420,1500p' artifacts/api-server/src/routes/ai-router.ts
          echo
          echo '=== UI APPLICATION TOKENS ==='
          sed -n '895,980p' artifacts/router-ia/src/App.tsx
          echo
          echo '=== CLIENT DEFINITIONS ==='
          grep -RniE 'useRevokeRouterAppToken|revokeRouterAppToken|RevokeRouterAppToken' . --exclude='*.map' --exclude-dir=node_modules | head -200 || true
