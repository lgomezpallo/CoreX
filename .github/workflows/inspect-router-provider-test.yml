name: Inspect Router Provider Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-router-provider-test.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Router export
        run: |
          set -euo pipefail
          rm -rf /tmp/router-export
          mkdir -p /tmp/router-export
          unzip -q 'router-ia-export 20260927.zip' -d /tmp/router-export
      - name: Inspect provider test and redirect usage
        working-directory: /tmp/router-export
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('artifacts/api-server/src'), Path('artifacts/router-ia/src'), Path('libs')]
          print('=== REDIRECT ERROR REFERENCES ===')
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob('*'):
                  if p.suffix not in {'.ts','.tsx','.js','.mjs'}:
                      continue
                  lines = p.read_text(errors='replace').splitlines()
                  for i,line in enumerate(lines,1):
                      if re.search(r'redirect\s*:\s*["\']error["\']', line):
                          print(f'{p}:{i}:{line}')

          print('\n=== PROVIDER TEST REFERENCES ===')
          pat = re.compile(r'test.*provider|provider.*test|connection.*test|test.*connection|Probar conexión|decryptApiKey|runProviderChat', re.I)
          count=0
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob('*'):
                  if p.suffix not in {'.ts','.tsx','.js','.mjs'}:
                      continue
                  lines = p.read_text(errors='replace').splitlines()
                  for i,line in enumerate(lines,1):
                      if pat.search(line):
                          print(f'{p}:{i}:{line}')
                          count += 1
                          if count >= 400:
                              raise SystemExit(0)
          PY
