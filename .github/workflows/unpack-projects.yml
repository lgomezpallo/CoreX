name: Unpack project archives

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Router-IA-Privado.zip'
      - 'Programacion-en-espanol.zip'
      - 'corex-project.zip'
      - '.github/workflows/unpack-projects.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack project archives
        shell: bash
        run: |
          set -euo pipefail
          rm -rf projects/router-ia projects/programacion-en-espanol projects/corex-replit
          mkdir -p projects/router-ia projects/programacion-en-espanol projects/corex-replit
          unzip -q Router-IA-Privado.zip -d projects/router-ia
          unzip -q Programacion-en-espanol.zip -d projects/programacion-en-espanol
          unzip -q corex-project.zip -d projects/corex-replit
          find projects -type d -name .git -prune -exec rm -rf {} + || true
          find projects -type f -name '.DS_Store' -delete || true

      - name: Commit extracted projects
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects
          if git diff --cached --quiet; then
            echo "No extracted changes to commit"
            exit 0
          fi
          git commit -m "Extract project archives including CoreX Replit"
          git push
