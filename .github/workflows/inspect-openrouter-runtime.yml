name: Inspect OpenRouter Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-openrouter-runtime.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and patch Router
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/router-export
          mkdir -p /tmp/router-export
          unzip -q 'router-ia-export 20260927.zip' -d /tmp/router-export
          python3 scripts/patch-router-cloudflare-account.py
          python3 scripts/patch-router-provider-accounts.py
          python3 scripts/fix-provider-account-ui.py
          python3 scripts/fix-radar-provider-discovery-types.py
          python3 scripts/expand-radar-free-providers.py
          python3 scripts/patch-router-cloudflare-runtime.py
          python3 scripts/patch-router-mobile-home.py
          python3 scripts/patch-openrouter-radar.py
      - name: Show OpenRouter client and route path
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/router-export
          echo '=== FRONTEND OPENROUTER MODAL ==='
          grep -Rni -C 20 'Router recibió una respuesta web inválida\|openrouter.ai/api/v1' "$ROOT/artifacts/router-ia/src" | head -260 || true
          echo '=== FRONTEND CREATE PROVIDER CALLS ==='
          grep -Rni -C 16 'createProvider\|useCreate\|providers.create\|/providers' "$ROOT/artifacts/router-ia/src" "$ROOT/libs" | head -360 || true
          echo '=== BACKEND POST PROVIDERS ==='
          grep -n -C 40 'router.post.*providers\|post.*providers\|validateOpenRouterKey' "$ROOT/artifacts/api-server/src/routes/ai-router.ts" | head -320 || true
          echo '=== REQUESTJSON ==='
          grep -n -C 50 'function requestJson\|const requestJson\|async function requestJson' "$ROOT/artifacts/api-server/src/lib/ai-router.ts" | head -260 || true
          echo '=== API CLIENT BASE ==='
          grep -Rni -C 20 'baseURL\|BASE_URL\|fetch(.*api\|axios.create' "$ROOT/artifacts/router-ia/src" "$ROOT/libs" | head -360 || true
