name: Inspect Account UI Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-account-ui-patch.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf /tmp/router-export && mkdir -p /tmp/router-export
          unzip -q 'router-ia-export 20260927.zip' -d /tmp/router-export
          python3 scripts/patch-router-cloudflare-account.py
          python3 scripts/patch-router-provider-accounts.py
          nl -ba /tmp/router-export/artifacts/router-ia/src/App.tsx | sed -n '450,515p'
