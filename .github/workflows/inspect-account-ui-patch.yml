name: Inspect Account UI Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-account-ui-patch.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf /tmp/router-export && mkdir -p /tmp/router-export
          unzip -q 'router-ia-export 20260927.zip' -d /tmp/router-export
          python3 scripts/patch-router-cloudflare-account.py
          python3 scripts/patch-router-provider-accounts.py
          python3 scripts/fix-provider-account-ui.py
          echo '=== RADAR TOP ==='
          nl -ba /tmp/router-export/artifacts/router-ia/src/pages/radar.tsx | sed -n '1,220p'
          echo '=== RADAR PAGE ==='
          nl -ba /tmp/router-export/artifacts/router-ia/src/pages/radar.tsx | sed -n '340,620p'
          echo '=== CREATE PROVIDER GENERATED ==='
          sed -n '230,330p' /tmp/router-export/lib/api-client-react/src/generated/api.ts
