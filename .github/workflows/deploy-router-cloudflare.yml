name: Deploy Router IA to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_CLERK_PROXY_URL: ${{ secrets.VITE_CLERK_PROXY_URL }}
      CLERK_PROXY_ENABLED: 'false'
      PORT: '8080'
      NODE_ENV: production
      BASE_PATH: /

    steps:
      - uses: actions/checkout@v4

      - name: Extract Router export
        run: |
          set -euo pipefail
          rm -rf /tmp/router-export
          mkdir -p /tmp/router-export
          unzip -q 'router-ia-export 20260927.zip' -d /tmp/router-export
          test -f /tmp/router-export/package.json
          test -f /tmp/router-export/pnpm-lock.yaml
          test -f /tmp/router-export/wrangler.jsonc

      - name: Inspect Radar implementation
        working-directory: /tmp/router-export
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('artifacts/api-server/src'), Path('artifacts/router-ia/src'), Path('lib')]
          pattern = re.compile(r'radar|catalog|openrouter|models?\.dev|/models|groq', re.I)
          hits = 0
          print('=== RADAR SOURCE MAP ===')
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if path.suffix not in {'.ts', '.tsx', '.js', '.mjs', '.json'}:
                      continue
                  lines = path.read_text(errors='replace').splitlines()
                  match_lines = [i for i, line in enumerate(lines) if pattern.search(line)]
                  if not match_lines:
                      continue
                  print(f'\n--- {path} ---')
                  shown = set()
                  for i in match_lines:
                      for j in range(max(0, i-3), min(len(lines), i+4)):
                          if j in shown:
                              continue
                          shown.add(j)
                          print(f'{j+1:04d}: {lines[j]}')
                          hits += 1
                          if hits >= 500:
                              print('=== RADAR SOURCE MAP TRUNCATED AT 500 LINES ===')
                              raise SystemExit(0)
          print(f'\n=== RADAR SOURCE MAP COMPLETE ({hits} excerpt lines) ===')
          PY

      - name: Harden Radar OpenRouter catalog fetch
        working-directory: /tmp/router-export
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('artifacts/api-server/src/lib/model-radar.ts')
          text = p.read_text()

          old_url = '"https://openrouter.ai/api/v1/models?limit=1000"'
          if old_url in text:
              text = text.replace(old_url, '"https://openrouter.ai/api/v1/models"', 1)

          if 'const MAX_RESPONSE_BYTES = 4_000_000;' in text:
              text = text.replace(
                  'const MAX_RESPONSE_BYTES = 4_000_000;',
                  'const MAX_RESPONSE_BYTES = 16_000_000;',
                  1,
              )

          text = text.replace('redirect: "error"', 'redirect: "follow"', 1)
          text = text.replace(
              'headers: { accept: "application/json" },',
              'headers: { accept: "application/json", "user-agent": "Router-IA-Radar/1.0" },',
              1,
          )

          p.write_text(text)
          print('Radar catalog fetch hardened for Cloudflare Workers')
          PY

      - name: Prepare Cloudflare config
        working-directory: /tmp/router-export
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('wrangler.jsonc')
          text = p.read_text()

          pattern = r'(?ms)^\s*"hyperdrive"\s*:\s*\[\s*\{\s*"binding"\s*:\s*"HYPERDRIVE"\s*,\s*"id"\s*:\s*"REPLACE_WITH_HYPERDRIVE_CONFIG_ID"\s*,?\s*\}\s*,?\s*\]\s*,?\s*'
          text, count = re.subn(pattern, '', text, count=1)
          if count != 1:
              raise SystemExit('Hyperdrive placeholder not found exactly once')

          flags_pattern = r'"compatibility_flags"\s*:\s*\[([^\]]*)\]'
          match = re.search(flags_pattern, text, re.S)
          if not match:
              raise SystemExit('compatibility_flags array not found')

          current = match.group(1)
          if 'global_fetch_strictly_public' not in current:
              stripped = current.rstrip()
              comma = ',' if stripped.strip() else ''
              replacement = '"compatibility_flags": [' + stripped + comma + '\n    "global_fetch_strictly_public"\n  ]'
              text = text[:match.start()] + replacement + text[match.end():]

          p.write_text(text)
          print('Hyperdrive removed and global_fetch_strictly_public enabled')
          PY

      - name: Use Workers-safe Express adapter and logging
        working-directory: /tmp/router-export
        run: |
          set -euo pipefail

          cat > artifacts/api-server/src/cloudflare.ts <<'TS'
          import { httpServerHandler } from "cloudflare:node";
          import app from "./app";

          const port = 3000;
          app.listen(port);
          export default httpServerHandler({ port });
          TS

          cat > artifacts/api-server/src/lib/logger.ts <<'TS'
          type LogArgs = unknown[];

          function log(method: "debug" | "info" | "warn" | "error", args: LogArgs): void {
            console[method](...args);
          }

          export const logger = {
            trace: (...args: LogArgs) => log("debug", args),
            debug: (...args: LogArgs) => log("debug", args),
            info: (...args: LogArgs) => log("info", args),
            warn: (...args: LogArgs) => log("warn", args),
            error: (...args: LogArgs) => log("error", args),
            fatal: (...args: LogArgs) => log("error", args),
            child: () => logger,
          };

          declare global {
            namespace Express {
              interface Request {
                log: typeof logger;
              }
            }
          }
          TS

          python3 - <<'PY'
          from pathlib import Path

          p = Path('artifacts/api-server/src/app.ts')
          text = p.read_text()
          text = text.replace('import pinoHttp from "pino-http";\n', '')

          marker = 'app.use(\n  pinoHttp({'
          if marker not in text:
              raise SystemExit('Expected pino-http middleware block not found')

          start = text.index(marker)
          end = text.index('app.use(CLERK_PROXY_PATH', start)
          replacement = '''app.use((req, _res, next) => {\n  req.log = logger;\n  req.log.info({ method: req.method, url: req.url?.split("?")[0] }, "http request");\n  next();\n});\n\napp.get("/__cloudflare_preflight", (_req, res) => {\n  res.json({ status: "ok" });\n});\n\n'''
          p.write_text(text[:start] + replacement + text[end:])
          print('Workers-safe logger installed with req.log compatibility')
          PY

      - name: Attach Clerk token to browser API requests
        working-directory: /tmp/router-export
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('artifacts/router-ia/src/App.tsx')
          text = p.read_text()

          import_marker = "  getListRouterAppTokensQueryKey,\n"
          if import_marker not in text:
              raise SystemExit('API client import marker not found')
          if 'setAuthTokenGetter,' not in text:
              text = text.replace(import_marker, "  setAuthTokenGetter,\n" + import_marker, 1)

          function_marker = 'function ClerkProviderWithRoutes() {'
          if function_marker not in text:
              raise SystemExit('ClerkProviderWithRoutes marker not found')
          if 'function ClerkApiAuthBridge() {' not in text:
              bridge = '''function ClerkApiAuthBridge() {\n  const { getToken, isLoaded, isSignedIn } = useAuth();\n\n  useEffect(() => {\n    if (!isLoaded || !isSignedIn) {\n      setAuthTokenGetter(null);\n      return;\n    }\n\n    setAuthTokenGetter(() => getToken());\n    return () => setAuthTokenGetter(null);\n  }, [getToken, isLoaded, isSignedIn]);\n\n  return null;\n}\n\n'''
              text = text.replace(function_marker, bridge + function_marker, 1)

          old = '<QueryClientProvider client={queryClient}><ClerkQueryClientCacheInvalidator /><Router /></QueryClientProvider>'
          new = '<QueryClientProvider client={queryClient}><ClerkApiAuthBridge /><ClerkQueryClientCacheInvalidator /><Router /></QueryClientProvider>'
          if old not in text and '<ClerkApiAuthBridge />' not in text:
              raise SystemExit('QueryClientProvider marker not found')
          text = text.replace(old, new, 1)
          text = text.replace('sesión local', 'sesión activa')

          p.write_text(text)
          print('Clerk bearer token bridge installed for API calls')
          PY

      - name: Static Cloudflare compatibility scan
        working-directory: /tmp/router-export
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('artifacts/api-server/src'), Path('lib')]
          checks = [
              ('Hyperdrive placeholder', re.compile(r'REPLACE_WITH_HYPERDRIVE_CONFIG_ID')),
              ('pino-http runtime reference', re.compile(r'pino-http')),
              ('Pino runtime import', re.compile(r'from\s+["\']pino["\']')),
              ('obsolete Cloudflare adapter', re.compile(r'handleAsNodeRequest')),
          ]
          findings = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if path.suffix not in {'.ts', '.tsx'}:
                      continue
                  text = path.read_text(errors='replace')
                  for label, pattern in checks:
                      if pattern.search(text):
                          findings.append(f'{label}: {path}')
          if findings:
              print('\n'.join(findings))
              raise SystemExit('Cloudflare-incompatible runtime reference still present')
          print('Static compatibility scan OK')
          PY

      - name: Check required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_DATABASE_URL SESSION_SECRET CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY VITE_CLERK_PUBLISHABLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: /tmp/router-export
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: /tmp/router-export
        run: pnpm run typecheck

      - name: Build
        working-directory: /tmp/router-export
        run: pnpm run build

      - name: Cloudflare dry run
        working-directory: /tmp/router-export
        run: pnpm run build:cloudflare

      - name: Local Workers runtime smoke test
        working-directory: /tmp/router-export
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          names = ['SUPABASE_DATABASE_URL','SESSION_SECRET','CLERK_PUBLISHABLE_KEY','CLERK_SECRET_KEY','VITE_CLERK_PUBLISHABLE_KEY']
          with open('.dev.vars', 'w') as f:
              for name in names:
                  f.write(f'{name}={json.dumps(os.environ[name])}\n')
          PY

          pnpm exec wrangler dev --local --port 8787 --config wrangler.jsonc > /tmp/router-wrangler-dev.log 2>&1 &
          WRANGLER_PID=$!
          cleanup() {
            kill "$WRANGLER_PID" 2>/dev/null || true
            rm -f .dev.vars
          }
          trap cleanup EXIT

          ready=0
          for i in $(seq 1 40); do
            if ! kill -0 "$WRANGLER_PID" 2>/dev/null; then
              cat /tmp/router-wrangler-dev.log
              exit 1
            fi
            code=$(curl -sS -o /tmp/preflight-body -w '%{http_code}' --max-time 2 http://127.0.0.1:8787/__cloudflare_preflight || true)
            if [ "$code" = '200' ]; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

          health_code=$(curl -sS -o /tmp/health-body -w '%{http_code}' --max-time 20 http://127.0.0.1:8787/health || true)
          echo "Local /health HTTP $health_code"
          cat /tmp/health-body || true
          echo
          test "$health_code" = '200'
          echo 'Local Workers runtime + Supabase health OK'

      - name: Upload Router runtime secrets to Cloudflare
        working-directory: /tmp/router-export
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SUPABASE_DATABASE_URL" | pnpm exec wrangler secret put SUPABASE_DATABASE_URL --config wrangler.jsonc
          printf '%s' "$SESSION_SECRET" | pnpm exec wrangler secret put SESSION_SECRET --config wrangler.jsonc
          printf '%s' "$CLERK_PUBLISHABLE_KEY" | pnpm exec wrangler secret put CLERK_PUBLISHABLE_KEY --config wrangler.jsonc
          printf '%s' "$CLERK_SECRET_KEY" | pnpm exec wrangler secret put CLERK_SECRET_KEY --config wrangler.jsonc
          printf '%s' "$VITE_CLERK_PUBLISHABLE_KEY" | pnpm exec wrangler secret put VITE_CLERK_PUBLISHABLE_KEY --config wrangler.jsonc
          if [ -n "${VITE_CLERK_PROXY_URL:-}" ]; then
            printf '%s' "$VITE_CLERK_PROXY_URL" | pnpm exec wrangler secret put VITE_CLERK_PROXY_URL --config wrangler.jsonc
          fi

      - name: Deploy Router IA
        working-directory: /tmp/router-export
        shell: bash
        run: |
          set -o pipefail
          pnpm exec wrangler deploy --config wrangler.jsonc 2>&1 | tee /tmp/router-deploy.log

      - name: Verify public Router
        working-directory: /tmp/router-export
        shell: bash
        run: |
          set -euo pipefail
          url=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/router-deploy.log | tail -1 || true)
          test -n "$url"
          echo "Public Router URL: $url"

          ready=0
          for i in $(seq 1 15); do
            root_code=$(curl -sS -o /tmp/public-root -w '%{http_code}' --max-time 20 "$url/" || true)
            health_code=$(curl -sS -o /tmp/public-health -w '%{http_code}' --max-time 20 "$url/health" || true)
            echo "Attempt $i: /=$root_code /health=$health_code"
            if [ "$root_code" = '200' ] && [ "$health_code" = '200' ]; then
              ready=1
              break
            fi
            sleep 2
          done

          cat /tmp/public-health || true
          echo
          test "$ready" -eq 1
          echo 'Public Router UI + Supabase health OK'
