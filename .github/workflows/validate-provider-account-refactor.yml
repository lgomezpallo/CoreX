name: Validate Provider Account Refactor

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-router-provider-accounts.py'
      - 'scripts/fix-provider-account-ui.py'
      - '.github/workflows/validate-provider-account-refactor.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PORT: '8080'
      NODE_ENV: production
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v4
      - name: Extract Router export
        run: |
          set -euo pipefail
          rm -rf /tmp/router-export
          mkdir -p /tmp/router-export
          unzip -q 'router-ia-export 20260927.zip' -d /tmp/router-export
      - name: Apply deployed compatibility patches
        working-directory: /tmp/router-export
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/patch-router-cloudflare-account.py"
          python3 "$GITHUB_WORKSPACE/scripts/patch-router-provider-accounts.py"
          python3 "$GITHUB_WORKSPACE/scripts/fix-provider-account-ui.py"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: /tmp/router-export
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: /tmp/router-export
        run: pnpm run typecheck
      - name: Build
        working-directory: /tmp/router-export
        run: pnpm run build
      - name: Show account-mode markers
        working-directory: /tmp/router-export
        run: |
          grep -n 'expandProviderAccountsForRouting' artifacts/api-server/src/routes/ai-router.ts
          grep -n 'listProviderAccountModels' artifacts/api-server/src/lib/ai-router.ts | head
          grep -n 'NVIDIA NIM' artifacts/router-ia/src/App.tsx | head
          grep -n 'Catálogo combinado' artifacts/router-ia/src/pages/radar.tsx | head
