name: Detach projects from Replit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detach-replit.yml'
      - 'scripts/detach_replit.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate

      - name: Remove Replit dependencies and metadata
        run: |
          set -euo pipefail
          python3 scripts/detach_replit.py
          for ROOT in \
            projects/router-ia/Router-IA-Privado \
            projects/programacion-en-espanol/Programacion-en-espanol
          do
            cd "$GITHUB_WORKSPACE/$ROOT"
            pnpm install --lockfile-only
          done

      - name: Verify no runtime Replit references remain
        run: |
          set -euo pipefail
          if grep -RIn \
            --exclude='pnpm-lock.yaml' \
            --exclude-dir='.git' \
            --exclude='*.md' \
            '@replit/\|REPL_ID\|\.replit-artifact' \
            projects/router-ia/Router-IA-Privado \
            projects/programacion-en-espanol/Programacion-en-espanol
          then
            echo 'Replit references still remain in runtime files.' >&2
            exit 1
          fi

      - name: Commit detached projects
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Detach Router IA and Programacion from Replit'
          git push
