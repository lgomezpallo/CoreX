name: Test Provider Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - name: Validate configured provider secrets
        shell: bash
        run: |
          set -euo pipefail

          fail=0
          : > results.txt

          check_present() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "$name: MISSING" | tee -a results.txt
              fail=1
              return 1
            fi
            echo "$name: PRESENT" | tee -a results.txt
            return 0
          }

          echo "=== Secret presence ==="
          check_present CLOUDFLARE_ACCOUNT_ID "${CLOUDFLARE_ACCOUNT_ID:-}" || true
          check_present CLOUDFLARE_API_TOKEN "${CLOUDFLARE_API_TOKEN:-}" || true
          check_present GROQ_API_KEY "${GROQ_API_KEY:-}" || true
          check_present NVIDIA_API_KEY "${NVIDIA_API_KEY:-}" || true

          echo
          echo "=== Cloudflare Workers AI ==="
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            code=$(curl -sS -o cf.json -w '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Accept: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/models/search?per_page=1")
            if [ "$code" = "200" ]; then
              echo "Cloudflare: OK" | tee -a results.txt
            else
              echo "Cloudflare: FAIL HTTP $code" | tee -a results.txt
              python3 -c "import json; d=json.load(open('cf.json')); errs=d.get('errors') or []; print('Cloudflare error:', '; '.join(str(e.get('message') or e.get('code') or 'unknown') for e in errs[:3]))" || true
              fail=1
            fi
          fi

          echo
          echo "=== Groq ==="
          if [ -n "${GROQ_API_KEY:-}" ]; then
            code=$(curl -sS -o groq.json -w '%{http_code}' \
              -H "Authorization: Bearer ${GROQ_API_KEY}" \
              -H 'Accept: application/json' \
              'https://api.groq.com/openai/v1/models')
            if [ "$code" = "200" ]; then
              echo "Groq: OK" | tee -a results.txt
            else
              echo "Groq: FAIL HTTP $code" | tee -a results.txt
              fail=1
            fi
          fi

          echo
          echo "=== NVIDIA ==="
          if [ -n "${NVIDIA_API_KEY:-}" ]; then
            code=$(curl -sS -o nvidia.json -w '%{http_code}' \
              -H "Authorization: Bearer ${NVIDIA_API_KEY}" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              --data '{"model":"openai/gpt-oss-20b","messages":[{"role":"user","content":"Reply only: OK"}],"max_tokens":1,"stream":false}' \
              'https://integrate.api.nvidia.com/v1/chat/completions')
            if [ "$code" = "200" ] || [ "$code" = "202" ]; then
              echo "NVIDIA: OK" | tee -a results.txt
            else
              echo "NVIDIA: FAIL HTTP $code" | tee -a results.txt
              fail=1
            fi
          fi

          echo
          echo "=== Summary ==="
          cat results.txt
          echo "No secret values were printed."

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
