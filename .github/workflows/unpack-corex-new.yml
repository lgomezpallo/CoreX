name: Prepare clean CoreX runtime

on:
  push:
    branches: [main]
    paths:
      - corex-workspace-full-20260929-115526-0300.zip
      - .github/workflows/unpack-corex-new.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Extract only the new CoreX workspace
        run: |
          set -euo pipefail
          ZIP='corex-workspace-full-20260929-115526-0300.zip'
          test -f "$ZIP"
          rm -rf /tmp/corex-runtime
          mkdir -p /tmp/corex-runtime
          unzip -q "$ZIP" -d /tmp/corex-runtime
          rm -rf /tmp/corex-runtime/.git /tmp/corex-runtime/.github

      - name: Add Render deployment descriptor
        run: |
          cat > /tmp/corex-runtime/render.yaml <<'YAML'
          services:
            - type: web
              name: corex
              runtime: node
              plan: free
              buildCommand: corepack enable && corepack prepare pnpm@10 --activate && pnpm install --frozen-lockfile && pnpm run build
              startCommand: pnpm start
              envVars:
                - key: NODE_VERSION
                  value: 22.12.0
                - key: VITE_SUPABASE_URL
                  value: https://ozaoejulipgskicmjzij.supabase.co
                - key: VITE_SUPABASE_PUBLIC_KEY
                  value: sb_publishable_dkmeo3ME7cHgEcbzBzdh_Q_5kOlCBFf
                - key: ROUTER_APP_KEY
                  sync: false
          YAML

      - name: Publish clean runtime branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/corex-runtime
          git init
          git checkout -b runtime
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish clean CoreX runtime from new workspace ZIP'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin runtime
