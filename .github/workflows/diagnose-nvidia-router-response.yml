name: Diagnose NVIDIA Router Response

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-nvidia-router-response.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract Router export
        run: |
          set -euo pipefail
          rm -rf /tmp/router-export
          mkdir -p /tmp/router-export
          unzip -q 'router-ia-export 20260927.zip' -d /tmp/router-export
      - name: Show Router parser excerpt
        working-directory: /tmp/router-export
        run: |
          echo '=== AI ROUTER PARSER ==='
          sed -n '150,460p' artifacts/api-server/src/lib/ai-router.ts
          echo '=== PROVIDER TEST ROUTE ==='
          sed -n '1000,1085p' artifacts/api-server/src/routes/ai-router.ts
      - name: Probe NVIDIA response shape safely
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NVIDIA_API_KEY:-}"
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          key = os.environ['NVIDIA_API_KEY']
          url = 'https://integrate.api.nvidia.com/v1/chat/completions'
          for max_tokens in (8, 96, 256):
              body = {
                  'model': 'openai/gpt-oss-20b',
                  'messages': [{'role':'user','content':'Reply only with OK'}],
                  'temperature': 0,
                  'max_tokens': max_tokens,
                  'stream': False,
              }
              req = urllib.request.Request(url, data=json.dumps(body).encode(), headers={
                  'Authorization': 'Bearer ' + key,
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
              }, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      payload = json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  print('HTTP', max_tokens, e.code, e.read().decode()[:500])
                  continue
              choice = (payload.get('choices') or [{}])[0]
              message = choice.get('message') or {}
              safe = {
                  'max_tokens': max_tokens,
                  'finish_reason': choice.get('finish_reason'),
                  'message_keys': sorted(message.keys()),
                  'content_type': type(message.get('content')).__name__,
                  'content': message.get('content') if isinstance(message.get('content'), str) else None,
                  'reasoning_content': message.get('reasoning_content') if isinstance(message.get('reasoning_content'), str) else None,
                  'reasoning': message.get('reasoning') if isinstance(message.get('reasoning'), str) else None,
                  'usage': payload.get('usage'),
              }
              for k in ('content','reasoning_content','reasoning'):
                  if isinstance(safe[k], str):
                      safe[k] = safe[k][:300]
              print(json.dumps(safe, ensure_ascii=False))
          PY
