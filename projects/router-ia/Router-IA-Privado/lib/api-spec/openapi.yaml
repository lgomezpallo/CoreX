openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: providers
    description: Configuración privada de proveedores de IA
  - name: router
    description: Pruebas y API común de Router IA
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: List configured providers
      responses:
        "200":
          description: Providers without secret keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Provider"
    post:
      operationId: createProvider
      tags: [providers]
      summary: Add a provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderInput"
      responses:
        "201":
          description: Provider saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
  /providers/{id}:
    patch:
      operationId: updateProvider
      tags: [providers]
      summary: Update provider settings or replace its key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdate"
      responses:
        "200":
          description: Provider updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "404":
          description: Provider not found
    delete:
      operationId: deleteProvider
      tags: [providers]
      summary: Remove a provider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Provider removed
        "404":
          description: Provider not found
  /providers/{id}/test:
    post:
      operationId: testProvider
      tags: [providers]
      summary: Check the provider key and model
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderTestResult"
        "404":
          description: Provider not found
  /router/summary:
    get:
      operationId: getRouterSummary
      tags: [router]
      summary: Get router status for the dashboard
      responses:
        "200":
          description: Router status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterSummary"
  /router/chat:
    post:
      operationId: sendRouterChat
      tags: [router]
      summary: Send a message from the private playground
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouterChatInput"
      responses:
        "200":
          description: Assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterChatResponse"
  /router/token:
    get:
      operationId: getRouterTokenStatus
      tags: [router]
      summary: Check whether an app token exists
      responses:
        "200":
          description: Token status without exposing the token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterTokenStatus"
    post:
      operationId: createRouterToken
      tags: [router]
      summary: Create or rotate the personal app token
      responses:
        "201":
          description: New token; shown only once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterTokenIssued"
    delete:
      operationId: revokeRouterToken
      tags: [router]
      summary: Revoke the personal app token
      responses:
        "204":
          description: Token revoked
  /router/app-tokens:
    get:
      operationId: listRouterAppTokens
      tags: [router]
      summary: List named application tokens without exposing their secrets
      responses:
        "200":
          description: Application tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RouterAppToken"
    post:
      operationId: createRouterAppToken
      tags: [router]
      summary: Create a named application token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouterAppTokenInput"
      responses:
        "201":
          description: New token; shown only once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterAppTokenIssued"
  /router/app-tokens/{id}:
    delete:
      operationId: revokeRouterAppToken
      tags: [router]
      summary: Revoke one named application token
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Application token revoked
        "404":
          description: Application token not found
  /router/status:
    get:
      operationId: getRouterStatus
      tags: [router]
      summary: Get routing health and recent usage metrics
      responses:
        "200":
          description: Router health, provider metrics, and recent activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterStatus"
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      tags: [router]
      summary: OpenAI-compatible chat completions endpoint for future apps
      description: "Requires Authorization: Bearer <router-token>. Streaming is not supported in this first version."
      security:
        - RouterBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenAIChatCompletionInput"
      responses:
        "200":
          description: OpenAI-compatible chat completion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIChatCompletion"
        "401":
          description: Missing or invalid router token
        "400":
          description: Invalid request or streaming not supported
components:
  securitySchemes:
    RouterBearer:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Provider:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum: [openai, anthropic, gemini, openai-compatible]
        baseUrl:
          type: ["string", "null"]
        model:
          type: string
        apiKeyPreview:
          type: string
        isDefault:
          type: boolean
        capabilities:
          type: array
          items:
            type: string
            enum: [chat, coding, reasoning, summarization, vision, document, long_context, fast]
        priority:
          type: integer
          minimum: 0
          maximum: 100
        isActive:
          type: boolean
        status:
          type: string
          enum: [untested, connected, error]
        healthStatus:
          type: string
          enum: [available, degraded, unavailable]
        consecutiveFailures:
          type: integer
          minimum: 0
        cooldownUntil:
          type: ["string", "null"]
          format: date-time
        lastTestAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, kind, baseUrl, model, apiKeyPreview, isDefault, capabilities, priority, isActive, status, healthStatus, consecutiveFailures, cooldownUntil, lastTestAt, createdAt, updatedAt]
    ProviderInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          type: string
          enum: [openai, anthropic, gemini, openai-compatible]
        apiKey:
          type: string
          minLength: 1
          maxLength: 4096
        model:
          type: string
          minLength: 1
          maxLength: 160
        baseUrl:
          type: string
          maxLength: 500
        isDefault:
          type: boolean
        capabilities:
          type: array
          maxItems: 8
          items:
            type: string
            enum: [chat, coding, reasoning, summarization, vision, document, long_context, fast]
        priority:
          type: integer
          minimum: 0
          maximum: 100
        isActive:
          type: boolean
      required: [name, kind, apiKey, model, isDefault]
    ProviderUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        apiKey:
          type: string
          minLength: 1
          maxLength: 4096
        model:
          type: string
          minLength: 1
          maxLength: 160
        baseUrl:
          type: ["string", "null"]
          maxLength: 500
        isDefault:
          type: boolean
        capabilities:
          type: array
          maxItems: 8
          items:
            type: string
            enum: [chat, coding, reasoning, summarization, vision, document, long_context, fast]
        priority:
          type: integer
          minimum: 0
          maximum: 100
        isActive:
          type: boolean
    ProviderTestResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        model:
          type: string
        latencyMs:
          type: integer
      required: [success, message, model, latencyMs]
    RouterSummary:
      type: object
      properties:
        providerCount:
          type: integer
        defaultProvider:
          anyOf:
            - $ref: "#/components/schemas/Provider"
            - type: "null"
        hasToken:
          type: boolean
      required: [providerCount, defaultProvider, hasToken]
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 32000
      required: [role, content]
    RouterChatInput:
      type: object
      properties:
        providerId:
          type: ["string", "null"]
          format: uuid
        taskType:
          type: string
          enum: [chat, coding, reasoning, summarization, vision, document]
        messages:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/ChatMessage"
        temperature:
          type: number
          minimum: 0
          maximum: 2
        maxTokens:
          type: integer
          minimum: 1
          maximum: 8192
      required: [messages]
    RouterChatResponse:
      type: object
      properties:
        content:
          type: string
        provider:
          type: string
        model:
          type: string
      required: [content, provider, model]
    RouterTokenStatus:
      type: object
      properties:
        active:
          type: boolean
        preview:
          type: ["string", "null"]
        createdAt:
          type: ["string", "null"]
          format: date-time
      required: [active, preview, createdAt]
    RouterTokenIssued:
      type: object
      properties:
        token:
          type: string
        preview:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [token, preview, createdAt]
    RouterAppToken:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        preview:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: ["string", "null"]
          format: date-time
      required: [id, name, preview, createdAt, lastUsedAt]
    RouterAppTokenInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
      required: [name]
    RouterAppTokenIssued:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        token:
          type: string
        preview:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, name, token, preview, createdAt]
    RouterProviderStatus:
      type: object
      properties:
        providerId:
          type: string
          format: uuid
        name:
          type: string
        model:
          type: string
        isActive:
          type: boolean
        healthStatus:
          type: string
          enum: [available, degraded, unavailable]
        requestCount:
          type: integer
        averageLatencyMs:
          type: ["integer", "null"]
        successRatePercent:
          type: ["number", "null"]
        lastUsedAt:
          type: ["string", "null"]
          format: date-time
      required: [providerId, name, model, isActive, healthStatus, requestCount, averageLatencyMs, successRatePercent, lastUsedAt]
    RouterRecentExecution:
      type: object
      properties:
        provider:
          type: string
        model:
          type: string
        applicationName:
          type: string
        createdAt:
          type: string
          format: date-time
        success:
          type: boolean
        attemptCount:
          type: integer
      required: [provider, model, applicationName, createdAt, success, attemptCount]
    RouterStatus:
      type: object
      properties:
        status:
          type: string
          enum: [available, degraded, unavailable, not_configured]
        providerCount:
          type: integer
        availableProviderCount:
          type: integer
        requests24h:
          type: integer
        fallbacks24h:
          type: integer
        averageLatencyMs:
          type: ["integer", "null"]
        successRatePercent:
          type: ["number", "null"]
        recentExecution:
          anyOf:
            - $ref: "#/components/schemas/RouterRecentExecution"
            - type: "null"
        providers:
          type: array
          items:
            $ref: "#/components/schemas/RouterProviderStatus"
      required: [status, providerCount, availableProviderCount, requests24h, fallbacks24h, averageLatencyMs, successRatePercent, recentExecution, providers]
    OpenAIChatCompletionInput:
      type: object
      properties:
        model:
          type: string
          maxLength: 160
        provider_id:
          type: string
          format: uuid
        task_type:
          type: string
          enum: [chat, coding, reasoning, summarization, vision, document]
        messages:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/ChatMessage"
        temperature:
          type: number
          minimum: 0
          maximum: 2
        max_tokens:
          type: integer
          minimum: 1
          maximum: 8192
        stream:
          type: boolean
      required: [messages]
    OpenAIChatCompletion:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                $ref: "#/components/schemas/ChatMessage"
              finish_reason:
                type: ["string", "null"]
            required: [index, message, finish_reason]
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
          required: [prompt_tokens, completion_tokens, total_tokens]
      required: [id, object, created, model, choices, usage]

